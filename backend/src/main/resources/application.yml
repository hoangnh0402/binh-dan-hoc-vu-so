server:
  port: ${PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: bdhvs-api
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=bdhvs;encrypt=true;trustServerCertificate=${DB_TRUST_CERT:true};applicationName=bdhvs-api
    username: ${DB_APP_USER:bdhvs_app}
    password: ${DB_APP_PASSWORD:Dev_App_Passw0rd!}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${DB_MIGRATOR_USER:bdhvs_migrator}
    password: ${DB_MIGRATOR_PASSWORD:Dev_Migrator_Passw0rd!}
    validate-on-migrate: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    default-property-inclusion: non_null

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:Bình Dân Học Vụ Số <no-reply@bdhvs.local>}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    access-ttl: 15m
  refresh:
    ttl: 7d
    remember-me-ttl: 30d
    cookie-secure: ${COOKIE_SECURE:true}
  upload-dir: ${UPLOAD_DIR:uploads}
  learning:
    default-duration-days: 21
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@bdhvs.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin12345}
    full-name: Quản trị viên
  seed-demo-data: ${SEED_DEMO_DATA:false}

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    vn.bdhvs: INFO

---
spring:
  config:
    activate:
      on-profile: dev
app:
  seed-demo-data: true
  refresh:
    cookie-secure: false
  dev:
    # Xem FlywayDevConfig: workaround lỗi sp_getapplock của SQL Server trên Docker Desktop/WSL2.
    flyway-skip-applock: true

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
